# Layered on top of application.properties when a test uses @ActiveProfiles("pg").
# The datasource URL/user/password come from the Testcontainers @ServiceConnection.
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=
spring.datasource.password=


# Real schema: Flyway builds it (V1, V2, ...), Hibernate only checks entities match.
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
