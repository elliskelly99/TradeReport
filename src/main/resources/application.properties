spring.application.name=TradeReport

##Database (shared Postgres so every instance sees the same audit table)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/tradereport}
spring.datasource.username=${DB_USER:tradereport}
spring.datasource.password=${DB_PASSWORD:tradereport}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.flyway.enabled=true

##Kafka
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP:localhost:9092}
app.kafka.partitions=${KAFKA_PARTITIONS:12}
app.kafka.replicas=${KAFKA_REPLICAS:1}

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.LongSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties[enable.idempotence]=true
spring.kafka.producer.properties[spring.json.add.type.headers]=false
spring.kafka.producer.properties[max.block.ms]=5000

# One group for every instance: Kafka spreads partitions across them (scale-out)
spring.kafka.consumer.group-id=trade-report-audit
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.key-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties[spring.deserializer.key.delegate.class]=org.apache.kafka.common.serialization.LongDeserializer
spring.kafka.consumer.properties[spring.deserializer.value.delegate.class]=org.springframework.kafka.support.serializer.JacksonJsonDeserializer
spring.kafka.consumer.properties[spring.json.value.default.type]=com.TradeReport.TradeReport.event.TradeReportEvent
spring.kafka.consumer.properties[spring.json.trusted.packages]=com.TradeReport.TradeReport.event
spring.kafka.listener.concurrency=${CONSUMER_CONCURRENCY:3}

##Outbox relay
app.outbox.relay.enabled=true
app.outbox.relay.poll-ms=500
app.outbox.relay.batch-size=100
